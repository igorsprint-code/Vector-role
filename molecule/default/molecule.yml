---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:latest
    pre_build_image: false
    command: sleep infinity

  - name: debian
    image: debian
    pre_build_image: false
    command: sleep infinity
    

scenario:
  name: default
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: /home/igor/08-ansible-05-testing/roles
verifier:
  name: ansible
  
